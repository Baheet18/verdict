[package]
name = "verdict"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["unstable"] }
serde_json = "1"
hex = "0.4"
primitive-types = { version = "0.13", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
