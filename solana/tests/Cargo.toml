[package]
name = "verdict-solana-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anchor-lang = "1.2.2"
base64 = "0.22"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
litesvm = { version = "0.18.2", features = ["precompiles"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
solana-account = "3"
solana-address = "2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
verdict = { path = "../programs/verdict", features = ["no-entrypoint"] }
