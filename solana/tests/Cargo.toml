[package]
name = "verdict-solana-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anchor-lang = "1.2.2"
base64 = "0.22"
ed25519-dalek = "2"
litesvm = { version = "0.18.2", features = ["precompiles"] }
solana-address = "2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
verdict = { path = "../programs/verdict", features = ["no-entrypoint"] }
