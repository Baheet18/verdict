[package]
name = "verdict"
version = "0.1.0"
description = "Solana resolver for Verdict prediction markets"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
solana-sdk-ids = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
