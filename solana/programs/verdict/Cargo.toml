[package]
name = "verdict"
version = "0.1.0"
description = "Solana resolver for Verdict prediction markets"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = ["custom-heap"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
solana-program-entrypoint = "3"
solana-keccak-hasher = { version = "3", features = ["sha3"] }
solana-secp256k1-recover = "3"
solana-sha256-hasher = { version = "3", features = ["sha2"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
